# Builds the Hermes gateway image and publishes it to GHCR, so Altare's
# Docker App can pull it. Runs on every push to main that touches the
# Dockerfile, the altare/ seed files, or this workflow.
# First build takes ~15-45 min (upstream image builds SQLite from source
# plus the full frontend); later builds reuse cached layers.
name: Build and publish image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - altare/**
      - .github/workflows/docker-publish.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
